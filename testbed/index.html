<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Mock Studio 测试页</title>
    <style>
      body {
        font: 14px/1.7 -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
        max-width: 820px;
        margin: 24px auto;
        padding: 0 16px;
        color-scheme: light dark;
      }
      button {
        font: inherit;
        padding: 6px 12px;
        margin: 0 6px 6px 0;
        cursor: pointer;
        border-radius: 6px;
        border: 1px solid rgba(128, 128, 128, 0.4);
        background: transparent;
        color: inherit;
      }
      pre {
        background: rgba(128, 128, 128, 0.1);
        padding: 10px;
        border-radius: 6px;
        font-size: 12px;
        max-height: 260px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-all;
      }
      h2 {
        font-size: 14px;
        margin: 20px 0 6px;
      }
      .hint {
        color: #888;
        font-size: 12px;
      }
      code {
        background: rgba(128, 128, 128, 0.15);
        padding: 1px 5px;
        border-radius: 3px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1 style="font-size: 18px">Mock Studio 测试页</h1>
    <p class="hint">
      用来验证拦截引擎是否工作。这个页面故意在 <code>document_start</code> 之后立刻发一个请求，
      用于检验规则下发时机（fail-open 行为）。
    </p>

    <h2>1. 引擎状态</h2>
    <button onclick="checkEngine()">检查引擎</button>
    <pre id="engine">点上面的按钮</pre>

    <h2>2. 发请求</h2>
    <button onclick="sendFetch('/api/goods/list')">fetch /api/goods/list</button>
    <button onclick="sendXhr('/api/goods/list')">XHR /api/goods/list</button>
    <button onclick="sendFetch('/api/virtual/never-exists')">fetch 虚拟接口</button>
    <button onclick="sendAxiosLike('/api/goods/detail?id=1')">模拟 axios（XHR+onload）</button>
    <pre id="out">尚未发送</pre>

    <h2>3. 早期请求（页面加载时自动发出）</h2>
    <pre id="early">…</pre>

    <script>
      // 刻意在最早的时机发一个请求，用于验证规则未就绪时的 fail-open 行为
      const earlyStarted = performance.now();
      fetch('/api/early-request')
        .then((r) => r.text())
        .then((t) => {
          document.getElementById('early').textContent =
            `t=${Math.round(earlyStarted)}ms 发出\n结果：${t.slice(0, 200)}`;
        })
        .catch((e) => {
          document.getElementById('early').textContent =
            `t=${Math.round(earlyStarted)}ms 发出\n失败（预期，因为没有 mock 且服务端无此接口）：${e.message}`;
        });

      function show(id, label, value) {
        const el = document.getElementById(id);
        el.textContent =
          `[${new Date().toLocaleTimeString()}] ${label}\n` +
          (typeof value === 'string' ? value : JSON.stringify(value, null, 2));
      }

      async function checkEngine() {
        const api = window.__MOCK_STUDIO__;
        if (!api) {
          show('engine', '未检测到引擎', '可能原因：\n1. 扩展未加载\n2. 加载后没刷新页面\n3. inject.js 构建缺失');
          return;
        }
        show('engine', `引擎已注入 · healthy=${api.healthy}`, {
          ...api.stats,
          未拦截的早期请求: api.missedBeforeReady,
        });
      }

      async function sendFetch(url) {
        try {
          const res = await fetch(url);
          const text = await res.text();
          show('out', `fetch ${url} → ${res.status}`, text.slice(0, 800));
        } catch (e) {
          show('out', `fetch ${url} 失败`, e.message);
        }
      }

      function sendXhr(url) {
        const x = new XMLHttpRequest();
        x.open('GET', url);
        x.onload = () => show('out', `XHR ${url} → ${x.status}`, x.responseText.slice(0, 800));
        x.onerror = () => show('out', `XHR ${url} 失败`, '网络错误');
        x.send();
      }

      /**
       * 模拟 axios 的调用方式：用 addEventListener 而非 onload 属性，
       * 并读取 responseText / getAllResponseHeaders。
       * 这两点是伪造 XHR 响应最容易出错的地方。
       */
      function sendAxiosLike(url) {
        const x = new XMLHttpRequest();
        x.open('GET', url);
        x.setRequestHeader('X-Test', '1');
        x.addEventListener('loadend', () => {
          show('out', `axios 风格 ${url} → ${x.status}`, {
            status: x.status,
            statusText: x.statusText,
            readyState: x.readyState,
            headers: x.getAllResponseHeaders(),
            contentType: x.getResponseHeader('content-type'),
            body: x.responseText.slice(0, 400),
          });
        });
        x.send();
      }
    </script>
  </body>
</html>
